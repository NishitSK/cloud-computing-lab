<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Streaming with S3 and CloudFront | Nishit S K</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: #0b1f3a; background: #ffffff; line-height: 1.5; }
  header { background: #0b1f3a; color: #ffffff; padding: 32px 24px; }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 8px 0 0; color: #c9d6ea; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000000; }
</style>
</head>
<body>
<header>
  <h1>Video Streaming with S3 and CloudFront</h1>
  <p>The video file sits in a private S3 bucket and is delivered through CloudFront</p>
</header>
<main>
  <!-- video.mp4 is uploaded to the same bucket, so the path is relative -->
  <video controls preload="metadata" src="video.mp4"></video>
</main>
</body>
</html>
